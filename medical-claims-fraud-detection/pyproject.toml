[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-claims-fraud-detection"
version = "0.1.0"
description = "Rule-based and statistical medical claims anomaly detection"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<4.0",
    "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]